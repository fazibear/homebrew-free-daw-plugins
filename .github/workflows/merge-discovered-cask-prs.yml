name: Merge validated discovered casks
run-name: Merge ${{ github.event.workflow_run.display_title }}

on:
  workflow_run:
    workflows: ["Validate discovered cask"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge validated bot PR
        env:
          GH_TOKEN: ${{ secrets.CASK_BOT_TOKEN }}
          READ_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          BOT_LOGIN: ${{ secrets.CASK_BOT_LOGIN }}
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER"
          test -n "$BOT_LOGIN"
          metadata="$(GH_TOKEN="$READ_TOKEN" gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json author,headRefName,headRepository,labels)"
          [[ "$(jq -r '.author.login' <<< "$metadata")" == "$BOT_LOGIN" ]]
          [[ "$(jq -r '.headRefName' <<< "$metadata")" == automation/discovered-* ]]
          [[ "$(jq -r '.headRepository.nameWithOwner' <<< "$metadata")" == "$REPOSITORY" ]]
          [[ "$(jq -r '[.labels[].name] | any(. == "automation")' <<< "$metadata")" == true ]]
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --squash --auto
