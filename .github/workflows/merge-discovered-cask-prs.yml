name: Merge validated discovered casks

on:
  workflow_run:
    workflows: ["Validate discovered cask"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: discovered-cask-merge
  cancel-in-progress: false

jobs:
  merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge validated bot PR
        env:
          GH_TOKEN: ${{ secrets.CASK_BOT_TOKEN }}
          READ_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER"
          metadata="$(GH_TOKEN="$READ_TOKEN" gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json headRefName,headRepository,labels)"
          head_ref="$(jq -r '.headRefName' <<< "$metadata")"
          [[ "$head_ref" == automation/discovered-* ]]
          [[ "$(jq -r '.headRepository.nameWithOwner' <<< "$metadata")" == "$REPOSITORY" ]]
          [[ "$(jq -r '[.labels[].name] | any(. == "automation")' <<< "$metadata")" == true ]]
          base_branch="$(GH_TOKEN="$READ_TOKEN" gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json baseRefName --jq .baseRefName)"
          head_branch="$(GH_TOKEN="$READ_TOKEN" gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json headRefName --jq .headRefName)"
          gh pr checkout "$PR_NUMBER" --repo "$REPOSITORY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$base_branch"
          git rebase "origin/$base_branch"
          git push --force-with-lease origin "HEAD:$head_branch"
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --squash --admin --delete-branch
