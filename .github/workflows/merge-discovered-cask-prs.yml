name: Merge validated discovered casks

on:
  workflow_run:
    workflows: ["Validate discovered cask"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-latest
    steps:
      - name: Merge validated bot PR
        env:
          GH_TOKEN: ${{ secrets.CASK_BOT_TOKEN }}
          READ_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER"
          metadata="$(GH_TOKEN="$READ_TOKEN" gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json headRefName,headRepository,labels)"
          head_ref="$(jq -r '.headRefName' <<< "$metadata")"
          [[ "$head_ref" == automation/discovered-* ]]
          [[ "$(jq -r '.headRepository.nameWithOwner' <<< "$metadata")" == "$REPOSITORY" ]]
          [[ "$(jq -r '[.labels[].name] | any(. == "automation")' <<< "$metadata")" == true ]]
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --squash --admin --delete-branch
