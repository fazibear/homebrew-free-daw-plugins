name: Merge validated discovered casks
run-name: Merge ${{ github.event.workflow_run.display_title }}

on:
  workflow_run:
    workflows: ["Validate discovered cask"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge validated bot PR
        env:
          GH_TOKEN: ${{ secrets.CASK_BOT_TOKEN }}
          READ_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          BOT_LOGIN: ${{ secrets.CASK_BOT_LOGIN }}
        run: python3 scripts/merge_discovered_cask_prs.py
