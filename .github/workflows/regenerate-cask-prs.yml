name: Refresh automated cask PRs
run-name: Refresh automated cask PRs

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number; leave blank to regenerate all open discovery cask PRs"
        required: false
        type: number

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CASK_BOT_TOKEN }}
      - name: Preserve the current generator
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cask-regenerator"
          cp .github/scripts/create_casks.py .github/scripts/regenerate_casks.py "$RUNNER_TEMP/cask-regenerator/"
      - name: Rebase and regenerate open discovery PRs
        env:
          GH_TOKEN: ${{ secrets.CASK_BOT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BOT_LOGIN: ${{ secrets.CASK_BOT_LOGIN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n "$PR_NUMBER" ]]; then
            pr_numbers=("$PR_NUMBER")
          else
            pr_numbers=()
            open_prs="$(gh pr list --repo "$REPOSITORY" --state open --limit 100 \
              --json number,author,headRefName,headRepository,labels)"
            echo "Open PRs returned by gh: $(jq 'length' <<< "$open_prs")"
            while IFS= read -r number; do
              pr_numbers+=("$number")
            done < <(jq -r --arg bot "$BOT_LOGIN" --arg repo "$REPOSITORY" \
              '.[] | select(.author.login == $bot and ((.headRefName | startswith("automation/discovered-plugins4free-")) or (.headRefName | startswith("automation/discovered-github-"))) and .headRepository.nameWithOwner == $repo and ([.labels[].name] | index("automation"))) | .number' \
              <<< "$open_prs")
            echo "Matching open discovery PRs: ${#pr_numbers[@]}"
          fi

          if ((${#pr_numbers[@]} == 0)); then
            echo "No matching open discovery cask PRs found."
            exit 0
          fi

          total_prs=${#pr_numbers[@]}
          printf 'PRs to regenerate: #%s\n' "$(IFS=', #'; echo "${pr_numbers[*]}")"

          regenerate_one() {
            local pr_number="$1"
            local position="$2"
            local total="$3"
            local metadata head_ref base_ref head_repo author has_label original_head
            local files=()

            metadata="$(gh pr view "$pr_number" --repo "$REPOSITORY" --json author,baseRefName,headRefName,headRepository,labels)" || return 1
            head_ref="$(jq -r '.headRefName' <<< "$metadata")"
            base_ref="$(jq -r '.baseRefName' <<< "$metadata")"
            head_repo="$(jq -r '.headRepository.nameWithOwner' <<< "$metadata")"
            author="$(jq -r '.author.login' <<< "$metadata")"
            has_label="$(jq -r '[.labels[].name] | any(. == "automation")' <<< "$metadata")"
            [[ "$head_ref" == automation/discovered-plugins4free-* || "$head_ref" == automation/discovered-github-* ]] || return 1
            [[ "$head_repo" == "$REPOSITORY" ]] || return 1
            [[ "$author" == "$BOT_LOGIN" ]] || return 1
            [[ "$has_label" == true ]] || return 1

            printf '\n\n\nRegenerating PR #%s (%d/%d)\n' "$pr_number" "$position" "$total"
            echo "  Rebasing onto $base_ref..."
            gh pr checkout "$pr_number" --repo "$REPOSITORY" || return 1
            original_head="$(git rev-parse HEAD)" || return 1
            git fetch origin "$base_ref" || return 1
            if ! git rebase "origin/$base_ref"; then
              git rebase --abort || true
              return 1
            fi

            while IFS= read -r file; do files+=("$file"); done < <(
              git diff --diff-filter=AM --name-only "origin/$base_ref...HEAD" -- 'Casks/*.rb'
            )
            if ((${#files[@]} == 0)); then
              echo "  Failed: no added or modified cask files found after rebase."
              return 1
            fi
            echo "  Regenerating ${#files[@]} cask(s)..."
            python3 "$RUNNER_TEMP/cask-regenerator/regenerate_casks.py" "${files[@]}" || return 1
            echo "  Checking generated Ruby syntax..."
            while IFS= read -r file; do ruby -c "$file" || return 1; done < <(
              git diff --name-only --diff-filter=AM -- 'Casks/*.rb'
            )

            if ! git diff --quiet -- Casks; then
              git add -- Casks
              git commit -m "Regenerate discovery casks" || return 1
            fi

            if [[ "$(git rev-parse HEAD)" != "$original_head" ]]; then
              echo "  Pushing regenerated casks..."
              git push --force-with-lease origin "HEAD:$head_ref" || return 1
              echo "  Done."
            else
              echo "  Already up to date."
            fi
          }

          failed_prs=()
          for index in "${!pr_numbers[@]}"; do
            pr_number="${pr_numbers[$index]}"
            position=$((index + 1))
            if ! regenerate_one "$pr_number" "$position" "$total_prs"; then
              echo "  FAILED: PR #$pr_number"
              echo "  Continuing with the next PR."
              failed_prs+=("$pr_number")
              git rebase --abort 2>/dev/null || true
              git reset --hard
            fi
          done
          if ((${#failed_prs[@]} > 0)); then
            failed_count=${#failed_prs[@]}
            failed_list="$(IFS=', '; echo "${failed_prs[*]}")"
            printf '\n%d PR(s) failed regeneration: #%s\n' "$failed_count" "$failed_list"
            exit 1
          fi
          printf '\nRegeneration succeeded for %d PR(s).\n' "$total_prs"
