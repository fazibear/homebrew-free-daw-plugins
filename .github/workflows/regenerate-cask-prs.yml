name: Regenerate cask PRs
run-name: Regenerate cask PRs

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number; leave blank to regenerate all open automation cask PRs"
        required: false
        type: number

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CASK_BOT_TOKEN }}
      - name: Regenerate open automation cask pull requests
        env:
          GH_TOKEN: ${{ secrets.CASK_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BOT_LOGIN: ${{ secrets.CASK_BOT_LOGIN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 scripts/regenerate_cask_prs.py
