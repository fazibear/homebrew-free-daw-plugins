name: Regenerate cask PRs
run-name: Regenerate cask PRs

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number; leave blank to regenerate all open discovery cask PRs"
        required: false
        type: number

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CASK_BOT_TOKEN }}
      - name: Preserve the current generator
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cask-regenerator"
          cp .github/scripts/create_casks.py .github/scripts/regenerate_casks.py "$RUNNER_TEMP/cask-regenerator/"
      - name: Rebase and regenerate open discovery PRs
        env:
          GH_TOKEN: ${{ secrets.CASK_BOT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BOT_LOGIN: ${{ secrets.CASK_BOT_LOGIN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n "$PR_NUMBER" ]]; then
            pr_numbers=("$PR_NUMBER")
          else
            pr_numbers=()
            open_prs="$(gh pr list --repo "$REPOSITORY" --state open --limit 100 \
              --json number,author,headRefName,headRepository,labels)"
            echo "Open PRs returned by gh: $(jq 'length' <<< "$open_prs")"
            while IFS= read -r number; do
              pr_numbers+=("$number")
            done < <(jq -r --arg bot "$BOT_LOGIN" --arg repo "$REPOSITORY" \
              '.[] | select(.author.login == $bot and ((.headRefName | startswith("automation/discovered-plugins4free-")) or (.headRefName | startswith("automation/discovered-github-"))) and .headRepository.nameWithOwner == $repo and ([.labels[].name] | index("automation"))) | .number' \
              <<< "$open_prs")
            echo "Matching open discovery PRs: ${#pr_numbers[@]}"
          fi

          if ((${#pr_numbers[@]} == 0)); then
            echo "No matching open discovery cask PRs found."
            exit 0
          fi

          total_prs=${#pr_numbers[@]}
          printf 'PRs to regenerate:'
          for pr_number in "${pr_numbers[@]}"; do printf ' #%s' "$pr_number"; done
          printf '\n'

          failure_reason=""
          failure_details=""
          run_step() {
            local label="$1"
            local log_file="$RUNNER_TEMP/regenerate-pr-${pr_number}.log"
            shift
            failure_reason="$label"
            if ! "$@" >"$log_file" 2>&1; then
              cat "$log_file"
              failure_details="$(tail -c 4000 "$log_file")"
              return 1
            fi
            cat "$log_file"
          }

          regenerate_one() {
            local pr_number="$1"
            local position="$2"
            local total="$3"
            local metadata head_ref base_ref head_repo author has_label regenerated_changes=false
            local files=()

            failure_reason=""
            failure_details=""
            failure_reason="Reading PR metadata"
            metadata="$(gh pr view "$pr_number" --repo "$REPOSITORY" --json author,baseRefName,headRefName,headRepository,labels 2>&1)" || {
              failure_details="$metadata"
              return 1
            }
            head_ref="$(jq -r '.headRefName' <<< "$metadata")"
            base_ref="$(jq -r '.baseRefName' <<< "$metadata")"
            head_repo="$(jq -r '.headRepository.nameWithOwner' <<< "$metadata")"
            author="$(jq -r '.author.login' <<< "$metadata")"
            has_label="$(jq -r '[.labels[].name] | any(. == "automation")' <<< "$metadata")"
            [[ "$head_ref" == automation/discovered-plugins4free-* || "$head_ref" == automation/discovered-github-* ]] || {
              failure_reason="Validating discovery branch"
              failure_details="Branch '$head_ref' is not a supported discovery branch."
              return 1
            }
            [[ "$head_repo" == "$REPOSITORY" ]] || {
              failure_reason="Validating PR repository"
              failure_details="PR head repository '$head_repo' does not match '$REPOSITORY'."
              return 1
            }
            [[ "$author" == "$BOT_LOGIN" ]] || {
              failure_reason="Validating PR author"
              failure_details="PR author '$author' does not match the configured bot login."
              return 1
            }
            [[ "$has_label" == true ]] || {
              failure_reason="Validating automation label"
              failure_details="PR does not have the automation label."
              return 1
            }

            printf '\n--- Regenerating PR #%s (%d/%d) ---\n' "$pr_number" "$position" "$total"
            echo "  Rebasing onto $base_ref..."
            run_step "Checking out PR branch" gh pr checkout "$pr_number" --repo "$REPOSITORY" || return 1
            run_step "Fetching base branch $base_ref" git fetch origin "$base_ref" || return 1
            if ! run_step "Rebasing onto $base_ref" git rebase "origin/$base_ref"; then
              git rebase --abort || true
              return 1
            fi

            while IFS= read -r file; do files+=("$file"); done < <(
              git diff --diff-filter=AM --name-only "origin/$base_ref...HEAD" -- 'Casks/*.rb'
            )
            if ((${#files[@]} == 0)); then
              echo "  Failed: no added or modified cask files found after rebase."
              failure_reason="Finding cask files"
              failure_details="No added or modified Casks/*.rb files were found after rebasing."
              return 1
            fi
            echo "  Regenerating ${#files[@]} cask(s)..."
            run_step "Regenerating casks" python3 "$RUNNER_TEMP/cask-regenerator/regenerate_casks.py" "${files[@]}" || return 1
            echo "  Checking generated Ruby syntax..."
            while IFS= read -r file; do run_step "Validating $file" ruby -c "$file" || return 1; done < <(
              git diff --name-only --diff-filter=AM -- 'Casks/*.rb'
            )

            if ! git diff --quiet -- Casks; then
              regenerated_changes=true
              git add -- Casks
              run_step "Committing regenerated casks" git commit -m "Regenerate discovery casks" || return 1
            fi

            if [[ "$regenerated_changes" == true ]]; then
              echo "  Pushing regenerated casks..."
              run_step "Pushing regenerated casks" git push --force-with-lease origin "HEAD:$head_ref" || return 1
              echo "  Done."
            else
              echo "  No generated cask changes; skipping commit and push."
            fi
          }

          failed_prs=()
          for index in "${!pr_numbers[@]}"; do
            pr_number="${pr_numbers[$index]}"
            position=$((index + 1))
            if ! regenerate_one "$pr_number" "$position" "$total_prs"; then
              echo "  FAILED: PR #$pr_number — ${failure_reason:-PR validation}"
              echo "  Continuing with the next PR."
              failed_prs+=("$pr_number")
              comment_file="$RUNNER_TEMP/pr-${pr_number}-failure.md"
              {
                echo "Automated cask regeneration failed during **${failure_reason:-PR validation}**."
                if [[ -n "$failure_details" ]]; then
                  echo
                  echo '```text'
                  printf '%s\n' "$failure_details"
                  echo '```'
                fi
                echo
                echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              } > "$comment_file"
              gh pr comment "$pr_number" --repo "$REPOSITORY" --body-file "$comment_file" || echo "  Could not post failure comment to PR #$pr_number."
              git rebase --abort 2>/dev/null || true
              git reset --hard
            fi
          done
          if ((${#failed_prs[@]} > 0)); then
            failed_count=${#failed_prs[@]}
            failed_list="$(IFS=', '; echo "${failed_prs[*]}")"
            printf '\n%d PR(s) failed regeneration: #%s\n' "$failed_count" "$failed_list"
            exit 1
          fi
          printf '\nRegeneration succeeded for %d PR(s).\n' "$total_prs"
