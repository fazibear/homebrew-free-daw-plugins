name: Discover free audio plugins on GitHub

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  discover:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find release installers and create casks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/github_plugins.py | python3 .github/scripts/create_casks.py
      - name: Open one pull request per cask
        env:
          GH_TOKEN: ${{ secrets.CASK_BOT_TOKEN }}
        run: |
          set -euo pipefail
          base_branch="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git ls-files --others --exclude-standard 'Casks/*.rb' | while IFS= read -r file; do
            test -n "$file"
            slug="$(basename "$file" .rb)"
            branch="automation/discovered-github-${slug}"
            pr_title="Add ${slug} cask"
            matching_prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state all --search "in:title \"$pr_title\"" --limit 100 \
              --json number,title,labels)"
            invalid_pr="$(jq -r --arg title "$pr_title" \
              'first(.[] | select(.title == $title and any(.labels[]; .name == "invalid")) | .number) // empty' \
              <<< "$matching_prs")"
            if [[ -n "$invalid_pr" ]]; then
              echo "Skipping $slug: PR #$invalid_pr titled '$pr_title' is marked invalid"
              continue
            fi
            if [[ "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq 'length')" -gt 0 ]]; then
              echo "Skipping $slug: an open GitHub discovery PR already exists"
              continue
            fi
            git checkout -B "$branch" "origin/${base_branch}"
            git add "$file"
            git commit -m "Add ${slug} cask"
            git push --force-with-lease origin "$branch"
            cask_name="$(sed -n 's/^  name "\(.*\)"$/\1/p' "$file")"
            cask_desc="$(sed -n 's/^  desc "\(.*\)"$/\1/p' "$file")"
            homepage="$(sed -n 's/^  homepage "\(.*\)"$/\1/p' "$file")"
            download_url="$(sed -n 's/^  url "\(.*\)"$/\1/p' "$file")"
            body="Automated GitHub discovery candidate."
            body+=$'\n\nName: '"$cask_name"
            body+=$'\nDescription: '"$cask_desc"
            body+=$'\nSource: '"$homepage"
            body+=$'\nHomepage: '"$homepage"
            body+=$'\nDownload: '"$download_url"
            body+=$'\n\nPlease review licensing, checksum, installer behavior, and Homebrew policy.'
            pr_url="$(gh pr create \
              --base "$base_branch" \
              --head "$branch" \
              --title "$pr_title" \
              --body "$body" \
              --label automation)"
          done
