name: Update versioned casks
run-name: Check versioned casks for updates

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CASK_BOT_TOKEN }}
      - name: Check matching casks for newer releases
        env:
          GH_TOKEN: ${{ secrets.CASK_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          base_branch="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          groups_dir="$RUNNER_TEMP/cask-update-groups"
          mkdir -p "$groups_dir"
          for file in Casks/*.rb; do
            version="$(sed -n 's/^  version "\([^"]*\)"$/\1/p' "$file" | head -n 1)"
            homepage="$(sed -n 's/^  homepage "\([^"]*\)"$/\1/p' "$file" | head -n 1)"
            url="$(sed -n 's/^  url "\([^"]*\)"$/\1/p' "$file" | head -n 1)"
            [[ -n "$version" && "$version" != latest ]] || continue
            [[ "$homepage" == https://github.com/* && "$url" == *github.com/* ]] || continue
            token="$(basename "$file" .rb)"
            case "$token" in
              *-vst3) plugin_key="${token%-vst3}" ;;
              *-vst) plugin_key="${token%-vst}" ;;
              *-au) plugin_key="${token%-au}" ;;
              *-clap) plugin_key="${token%-clap}" ;;
              *-lv2) plugin_key="${token%-lv2}" ;;
              *) plugin_key="$token" ;;
            esac
            printf '%s\n' "$file" >> "$groups_dir/$plugin_key"
          done

          shopt -s nullglob
          groups=("$groups_dir"/*)
          if ((${#groups[@]} == 0)); then
            echo "No versioned GitHub casks found to check."
            exit 0
          fi
          for group in "${groups[@]}"; do
            plugin_key="$(basename "$group")"
            branch="automation/cask-updates-${plugin_key}"
            group_files=()
            while IFS= read -r file; do group_files+=("$file"); done < "$group"
            git reset --hard "origin/${base_branch}"
            git checkout -B "$branch" "origin/${base_branch}"
            python3 scripts/update_casks.py "${group_files[@]}"

            changed_files="$(git diff --name-only -- Casks)"
            if [[ -z "$changed_files" ]]; then
              echo "No updates for ${plugin_key}."
              continue
            fi
            changed_group_files=()
            while IFS= read -r file; do changed_group_files+=("$file"); done <<< "$changed_files"
            git add -- "${changed_group_files[@]}"
            git commit -m "Update ${plugin_key} casks"
            git push --force-with-lease origin "$branch"

            first_file="${group_files[0]}"
            plugin_name="$(sed -n 's/^  name "\(.*\)"$/\1/p' "$first_file")"
            for suffix in " AU" " VST3" " VST" " CLAP" " LV2" "-AU" "-VST3" "-VST" "-CLAP" "-LV2"; do
              case "$plugin_name" in *"$suffix") plugin_name="${plugin_name%$suffix}" ;; esac
            done
            pr_title="Update ${plugin_name:-$plugin_key} casks"
            body="Automated update check for versioned casks using their GitHub Releases."$'\n\n''Updated casks:'
            for file in "${changed_group_files[@]}"; do
              old_version="$(git show "origin/${base_branch}:${file}" | sed -n 's/^  version "\([^"]*\)"$/\1/p' | head -n 1)"
              new_version="$(sed -n 's/^  version "\([^"]*\)"$/\1/p' "$file" | head -n 1)"
              cask_token="$(basename "$file" .rb)"
              body+=$'\n- '"$cask_token: $old_version → $new_version"
            done
            body+=$'\n\nPlease review the updated versions, download URLs, and checksums.'
            open_pr="$(gh pr list --repo "$REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')"
            if [[ -n "$open_pr" ]]; then
              gh pr edit "$open_pr" --repo "$REPOSITORY" --title "$pr_title" --body "$body"
            else
              gh pr create --repo "$REPOSITORY" --base "$base_branch" --head "$branch" \
                --title "$pr_title" --body "$body" --label automation
            fi
          done
