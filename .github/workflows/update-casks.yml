name: Update versioned casks
run-name: Check versioned casks for updates

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CASK_BOT_TOKEN }}
      - name: Check matching casks and open update pull requests
        env:
          GH_TOKEN: ${{ secrets.CASK_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/update_casks.py
