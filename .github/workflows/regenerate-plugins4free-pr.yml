name: Regenerate Plugins4Free cask PR
run-name: Regenerate Plugins4Free PR #${{ inputs.pr_number }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Existing Plugins4Free discovery PR number"
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CASK_BOT_TOKEN }}
      - name: Preserve the current generator
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cask-regenerator"
          cp .github/scripts/create_casks.py .github/scripts/regenerate_casks.py "$RUNNER_TEMP/cask-regenerator/"
      - name: Check out and validate the existing discovery PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.CASK_BOT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BOT_LOGIN: ${{ secrets.CASK_BOT_LOGIN }}
        run: |
          set -euo pipefail
          metadata="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json author,baseRefName,headRefName,headRepository,labels)"
          head_ref="$(jq -r '.headRefName' <<< "$metadata")"
          base_ref="$(jq -r '.baseRefName' <<< "$metadata")"
          head_repo="$(jq -r '.headRepository.nameWithOwner' <<< "$metadata")"
          author="$(jq -r '.author.login' <<< "$metadata")"
          has_label="$(jq -r '[.labels[].name] | any(. == "automation")' <<< "$metadata")"
          [[ "$head_ref" == automation/discovered-plugins4free-* ]]
          [[ "$head_repo" == "$REPOSITORY" ]]
          [[ "$author" == "$BOT_LOGIN" ]]
          [[ "$has_label" == true ]]
          gh pr checkout "$PR_NUMBER" --repo "$REPOSITORY"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
      - name: Regenerate casks with the current generator
        env:
          GH_TOKEN: ${{ secrets.CASK_BOT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          set -euo pipefail
          original_head="$(git rev-parse HEAD)"
          git fetch origin "$BASE_REF"
          git rebase "origin/$BASE_REF"
          files=()
          while IFS= read -r file; do files+=("$file"); done < <(git diff --diff-filter=AM --name-only "origin/$BASE_REF...HEAD" -- 'Casks/*.rb')
          ((${#files[@]} > 0))
          python3 "$RUNNER_TEMP/cask-regenerator/regenerate_casks.py" "${files[@]}"
          for file in "${files[@]}"; do ruby -c "$file"; done
          if ! git diff --quiet -- "${files[@]}"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${files[@]}"
            git commit -m "Regenerate Plugins4Free casks"
          fi
          if [[ "$(git rev-parse HEAD)" != "$original_head" ]]; then
            git push --force-with-lease origin "HEAD:$HEAD_REF"
          else
            echo "PR already matches the base branch and current generator"
          fi
