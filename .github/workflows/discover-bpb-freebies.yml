name: Discover Bedroom Producers Blog monthly freebies

on:
  schedule:
    - cron: "23 9 2 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Lightpanda
        run: |
          curl --fail --location --retry 3 \
            https://github.com/lightpanda-io/browser/releases/download/nightly/lightpanda-x86_64-linux \
            --output "$RUNNER_TEMP/lightpanda"
          chmod +x "$RUNNER_TEMP/lightpanda"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Discover freebies and open cask pull requests
        env:
          GH_TOKEN: ${{ secrets.CASK_BOT_TOKEN }}
        run: python3 scripts/discover_bpb_freebies.py
