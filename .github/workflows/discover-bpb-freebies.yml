name: Discover Bedroom Producers Blog monthly freebies

on:
  schedule:
    - cron: "23 9 2 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Lightpanda
        run: |
          brew install lightpanda-io/browser/lightpanda
          lightpanda version
      - name: Discover freebies and open cask pull requests
        env:
          GH_TOKEN: ${{ secrets.CASK_BOT_TOKEN }}
        run: python3 scripts/discover_bpb_freebies.py
