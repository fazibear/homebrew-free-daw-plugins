name: Validate discovered cask
run-name: Validate ${{ github.event.pull_request.title }}

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.CASK_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and install casks
        env:
          GH_TOKEN: ${{ secrets.CASK_BOT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/validate_cask_pr.py
