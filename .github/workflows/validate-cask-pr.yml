name: Validate discovered cask
run-name: Validate ${{ github.event.pull_request.title }}

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.CASK_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.CASK_BOT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          INPUT_PR="${{ github.event.pull_request.number }}"
          metadata="$(gh pr view "$INPUT_PR" --repo "$REPOSITORY" --json headRefName,headRepository,labels)"
          head_ref="$(jq -r '.headRefName' <<< "$metadata")"
          head_repo="$(jq -r '.headRepository.nameWithOwner' <<< "$metadata")"
          has_automation_label="$(jq -r '[.labels[].name] | any(. == "automation")' <<< "$metadata")"
          [[ "$head_ref" == automation/discovered-* || "$head_ref" == automation/cask-updates-* ]]
          [[ "$head_repo" == "$REPOSITORY" ]]
          [[ "$has_automation_label" == true ]]
          gh pr checkout "$INPUT_PR" --repo "$REPOSITORY"
          echo "number=$INPUT_PR" >> "$GITHUB_OUTPUT"
      - name: Validate Ruby syntax
        id: ruby_syntax
        run: |
          set -euo pipefail
          exec 2> >(tee "$RUNNER_TEMP/validate-ruby-syntax.stderr.log" >&2)
          base_sha="$(gh pr view "${{ steps.pr.outputs.number }}" --json baseRefOid --jq .baseRefOid)"
          head_sha="$(gh pr view "${{ steps.pr.outputs.number }}" --json headRefOid --jq .headRefOid)"
          files="$(git diff --diff-filter=AM --name-only "$base_sha" "$head_sha" -- 'Casks/*.rb')"
          [[ -n "$files" ]] || { echo "No added or modified Casks/*.rb files found in the PR." >&2; exit 1; }
          for file in $files; do
            [[ -f "$file" ]] || { echo "Changed cask file is missing: $file" >&2; exit 1; }
            ruby -c "$file"
          done
      - name: Validate cask declarations
        id: cask_declarations
        run: |
          set -euo pipefail
          exec 2> >(tee "$RUNNER_TEMP/validate-cask-declarations.stderr.log" >&2)
          base_sha="$(gh pr view "${{ steps.pr.outputs.number }}" --json baseRefOid --jq .baseRefOid)"
          head_sha="$(gh pr view "${{ steps.pr.outputs.number }}" --json headRefOid --jq .headRefOid)"
          files="$(git diff --diff-filter=AM --name-only "$base_sha" "$head_sha" -- 'Casks/*.rb')"
          for file in $files; do
            grep -Eq '^cask "[a-z0-9][a-z0-9-]*" do$' "$file" || { echo "$file: missing or invalid cask token declaration" >&2; exit 1; }
            grep -Eq '^  url "https?://' "$file" || { echo "$file: missing or invalid HTTP(S) URL" >&2; exit 1; }
            grep -Eq '^  sha256 ("[0-9a-f]{64}"|:no_check)$' "$file" || { echo "$file: missing or invalid sha256" >&2; exit 1; }
            grep -Eq '^  depends_on :macos$' "$file" || { echo "$file: missing macOS dependency declaration" >&2; exit 1; }
          done
      - name: Install changed casks
        id: install_casks
        run: |
          set -euo pipefail
          exec 2> >(tee "$RUNNER_TEMP/install-changed-casks.stderr.log" >&2)
          base_sha="$(gh pr view "${{ steps.pr.outputs.number }}" --json baseRefOid --jq .baseRefOid)"
          head_sha="$(gh pr view "${{ steps.pr.outputs.number }}" --json headRefOid --jq .headRefOid)"
          files="$(git diff --diff-filter=AM --name-only "$base_sha" "$head_sha" -- 'Casks/*.rb')"
          brew tap "$GITHUB_REPOSITORY" "$GITHUB_WORKSPACE"
          for file in $files; do
            token="$(sed -n 's/^cask "\([a-z0-9-]*\)" do$/\1/p' "$file")"
            echo "Installing $token from $file"
            brew install --cask --verbose "$GITHUB_REPOSITORY/$token"
            brew uninstall --cask --force "$GITHUB_REPOSITORY/$token"
          done
      - name: Comment on cask validation failure
        if: ${{ failure() && steps.pr.outputs.number != '' }}
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          FAILED_STEP: ${{ steps.ruby_syntax.outcome == 'failure' && 'Validate Ruby syntax' || steps.cask_declarations.outcome == 'failure' && 'Validate cask declarations' || steps.install_casks.outcome == 'failure' && 'Install changed casks' || 'Prepare or run cask validation' }}
          FAILED_STDERR: ${{ steps.ruby_syntax.outcome == 'failure' && format('{0}/validate-ruby-syntax.stderr.log', runner.temp) || steps.cask_declarations.outcome == 'failure' && format('{0}/validate-cask-declarations.stderr.log', runner.temp) || steps.install_casks.outcome == 'failure' && format('{0}/install-changed-casks.stderr.log', runner.temp) || '' }}
        run: |
          set -euo pipefail
          comment_file="$RUNNER_TEMP/cask-validation-failure.md"
          {
            echo "Cask validation failed during **$FAILED_STEP**."
            if [[ -n "$FAILED_STDERR" && -f "$FAILED_STDERR" ]]; then
              echo
              echo '```text'
              tail -c 4000 "$FAILED_STDERR"
              echo
              echo '```'
            else
              echo
              echo "No command output was captured. Check the workflow run for details."
            fi
            echo
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$comment_file"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$comment_file"
